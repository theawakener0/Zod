name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet -composites=false ./...
      - name: Build (native)
        run: go build ./...
      - name: Build (cross GOARCH check)
        env:
          CGO_ENABLED: 0
          GOARCH: ${{ matrix.arch }}
        run: go build ./...
      - name: Build (cross darwin)
        env:
          CGO_ENABLED: 0
          GOOS: darwin
          GOARCH: amd64
        run: go build ./...
      - name: Build (cross windows)
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: amd64
        run: go build ./...
      - name: Test with race detector
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...
      - name: Test with coverage (report only)
        if: runner.os == 'Linux'
        run: |
          go test -coverprofile=coverage.out -count=1 ./...
          go tool cover -func=coverage.out | tail -20
      - name: Test (native, no cross-arch env)
        run: go test -count=1 ./...
      - name: Verify evaluator is archived
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if go list ./... | grep -qx 'github.com/theawakener0/Zod/evaluator'; then
            echo "evaluator package is still present" >&2
            exit 1
          fi
          echo "evaluator package is archived"
      - name: Verify eval engine is rejected
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          out=$(mktemp)
          go run . --eng=eval examples/hello.zd >"$out" 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected --eng=eval to fail, but it exited 0" >&2
            cat "$out" >&2
            exit 1
          fi
          if ! grep -q "eval engine was removed" "$out"; then
            echo "expected error containing 'eval engine was removed'" >&2
            cat "$out" >&2
            exit 1
          fi
      - name: Stdlib smoke (VM)
        run: go run . examples/std_demo.zd && go run . examples/std_bytes_demo.zd && go run . examples/std_err_demo.zd
      - name: Stdlib fs smoke (VM, non-Windows)
        if: runner.os != 'Windows'
        run: go run . examples/std_fs_demo.zd
      - name: Z-Lisp demo tests (VM)
        run: go run . examples/demo/zlisp/tests.zd
      - name: Z-Lisp REPL smoke (VM)
        shell: bash
        run: |
          out=$(mktemp)
          echo exit | go run . examples/demo/zlisp/repl.zd > "$out"
          grep -q "f####Gfffffffffff" "$out"
          grep -q "Z-Lisp REPL" "$out"
          grep -q "z-lisp>" "$out"
