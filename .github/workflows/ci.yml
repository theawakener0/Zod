name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet -composites=false ./...
      - name: Build (native)
        run: go build ./...
      - name: Build (cross GOARCH check)
        env:
          CGO_ENABLED: 0
          GOARCH: ${{ matrix.arch }}
        run: go build ./...
      - name: Build (cross darwin)
        env:
          CGO_ENABLED: 0
          GOOS: darwin
          GOARCH: amd64
        run: go build ./...
      - name: Build (cross windows)
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: amd64
        run: go build ./...
      - name: Test with race detector
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...
      - name: Test with coverage (report only)
        if: runner.os == 'Linux'
        run: |
          go test -coverprofile=coverage.out -count=1 ./...
          go tool cover -func=coverage.out | tail -20
      - name: Test (native, no cross-arch env)
        run: go test -count=1 ./...
      - name: Stdlib smoke (eval + vm)
        run: go run . --eng=eval examples/std_demo.zd && go run . --eng=vm examples/std_demo.zd && go run . --eng=eval examples/std_bytes_demo.zd && go run . --eng=vm examples/std_bytes_demo.zd && go run . --eng=eval examples/std_err_demo.zd && go run . --eng=vm examples/std_err_demo.zd
      - name: Stdlib fs smoke (non-Windows)
        if: runner.os != 'Windows'
        run: go run . --eng=eval examples/std_fs_demo.zd && go run . --eng=vm examples/std_fs_demo.zd
