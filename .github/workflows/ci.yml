name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet -composites=false ./...
      - name: Build
        env:
          GOARCH: ${{ matrix.arch }}
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: Stdlib smoke (eval + vm)
        run: go run . examples/std_demo.zd && go run . --eng=vm examples/std_demo.zd && go run . examples/std_bytes_demo.zd && go run . --eng=vm examples/std_bytes_demo.zd && go run . examples/std_err_demo.zd && go run . --eng=vm examples/std_err_demo.zd
      - name: Stdlib fs smoke (non-Windows)
        if: runner.os != 'Windows'
        run: go run . examples/std_fs_demo.zd && go run . --eng=vm examples/std_fs_demo.zd
